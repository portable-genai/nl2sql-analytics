# NL2SQL Semantic Analyst (H1) runtime configuration.
#
# Loaded by `src/nl2sql_analytics/config.py`. Point at a different file with
# NL2SQL_SETTINGS; a path that is named but missing is a boot error, not
# a silent fall-back to built-in defaults.
#
# `${VAR}` and `${VAR:-default}` resolve in THREE states: unset takes the default written here,
# SET-AND-EMPTY resolves to empty (an operator who emptied a value expressed an intent, and it
# names nothing), and a set value wins. This file holds env var NAMES and non-secret defaults
# only: no secret value is ever committed here.

# Data residency. Selected once and shared by the runtime and Terraform.
region: ${GCP_REGION:-asia-southeast1}

# Tenant partition asserted on outbound reviews when the verified principal carries none.
# (Built as one template expression: a literal "${" immediately before a template opener is
# ambiguous to render, so the whole reference is produced by the expression instead.)
tenant: ${NL2SQL_TENANT:-}

# Local profile stores. ":memory:" is the ephemeral, deterministic default the gate uses; a
# deployment points this at a durable path.
audit_path: ${NL2SQL_AUDIT_PATH:-:memory:}

# The external head anchor for the WORM audit chain (practices check C9). The hash chain cannot
# detect a TRUNCATED TAIL by itself: dropping the newest rows leaves a shorter chain that
# verifies perfectly. Point this at a file on a DIFFERENT volume, under different credentials,
# from audit_path, and every append also writes the chain head there. Empty (the default) means
# no anchor, which is correct for the ephemeral ":memory:" store and wrong for a durable one.
audit_anchor_path: ${NL2SQL_AUDIT_ANCHOR:-}

# The audience the managed (gcp) IAP identity adapter verifies the assertion AGAINST: the
# IAP-protected resource, "/projects/<NUM>/global/backendServices/<ID>" behind an HTTPS load
# balancer. It is per-deployment, so it is configuration and never a literal in the adapter.
# Three states, and UNSET and SET-AND-EMPTY land in the same place on purpose: both resolve to
# empty, and an empty audience REFUSES every caller rather than verifying without one.
# google-auth documents audience=None as "the audience is not verified", which accepts ANY
# Google-signed OIDC token, from any project or any app, and reads its email as a principal.
iap_audience: ${NL2SQL_IAP_AUDIENCE:-}

# Rule R8: where an escalated result is routed for human review. The managed profile REFUSES to
# swallow an escalation when this is empty, so a producer cannot ship with R8 unwired.
# The outbound S2S credentials are HUMAN_REVIEW_S2S_TOKEN / HUMAN_REVIEW_S2S_SIGNING_KEY (see .env.secrets.example),
# deliberately distinct from this service's own inbound NL2SQL_S2S_TOKEN.
review_url: ${HUMAN_REVIEW_URL:-}

# The per-port adapter map: the ONLY place a binding lives, so switching the whole stack is a
# configuration change rather than a code edit. Every port must bind every profile; the loader
# refuses a partial block and `tests/test_settings_file.py` fails the build if this drifts from
# `config.DEFAULT_BINDINGS`.
project_id: ${GOOGLE_CLOUD_PROJECT:-}

adapters:
  audit:
    local: nl2sql_analytics.adapters.local.audit:LocalAuditAdapter
    gcp: nl2sql_analytics.adapters.gcp.audit:CloudAuditAdapter
    onprem: nl2sql_analytics.adapters.onprem.audit:OnPremAuditAdapter
  identity:
    local: nl2sql_analytics.adapters.local.identity:LocalIdentityAdapter
    gcp: nl2sql_analytics.adapters.gcp.identity:IapIdentityAdapter
    onprem: nl2sql_analytics.adapters.onprem.identity:OnPremIdentityAdapter
  review_router:
    local: nl2sql_analytics.adapters.local.review_router:LocalReviewRouter
    gcp: nl2sql_analytics.adapters.gcp.review_router:CloudReviewRouter
    onprem: nl2sql_analytics.adapters.onprem.review_router:OnPremReviewRouter

  # Tracing. Which BACKEND a deployed profile exports to is not a binding: the gcp
  # adapter reads OTEL_EXPORTER_OTLP_ENDPOINT and sends OTLP to the Hrz5 collector when it
  # is set, straight to Cloud Trace when it is not. Tracing is not essential to
  # correctness, so onprem is ABSENT rather than fatal, unlike the other placeholders.
  tracer:
    local: nl2sql_analytics.adapters.local.tracer:LocalNoopTracerAdapter
    gcp: nl2sql_analytics.adapters.gcp.tracer:CloudTracerAdapter
    onprem: nl2sql_analytics.adapters.onprem.tracer:OnPremTracerAdapter

  # The promotion authority (Hrz4). The local adapter scores offline but REFUSES to
  # promote: a promotion certified by a laptop with no quality service is certified by
  # nothing.
  evaluation:
    local: nl2sql_analytics.adapters.local.evaluation:LocalOfflineEvalAdapter
    gcp: nl2sql_analytics.adapters.gcp.evaluation:ManagedEvalGateAdapter
    onprem: nl2sql_analytics.adapters.onprem.evaluation:OnPremEvalAdapter
  certification:
    local: nl2sql_analytics.adapters.local.certification:LocalCertificationAdapter
    gcp: nl2sql_analytics.adapters.gcp.certification:CloudCertificationAdapter
    onprem: nl2sql_analytics.adapters.onprem.certification:OnPremCertificationAdapter
  dictionary:
    local: nl2sql_analytics.adapters.local.dictionary:LocalDictionaryAdapter
    gcp: nl2sql_analytics.adapters.gcp.dictionary:CloudDictionaryAdapter
    onprem: nl2sql_analytics.adapters.onprem.dictionary:OnPremDictionaryAdapter
  llm:
    local: nl2sql_analytics.adapters.local.llm:LocalAnalystLlm
    gcp: nl2sql_analytics.adapters.gcp.llm:CloudAnalystLlm
    onprem: nl2sql_analytics.adapters.onprem.llm:OnPremAnalystLlm
  query_engine:
    local: nl2sql_analytics.adapters.local.query_engine:LocalQueryEngineAdapter
    gcp: nl2sql_analytics.adapters.gcp.query_engine:CloudQueryEngineAdapter
    onprem: nl2sql_analytics.adapters.onprem.query_engine:OnPremQueryEngineAdapter
  guardrail:
    local: nl2sql_analytics.adapters.local.guardrail:LocalGuardrailAdapter
    gcp: nl2sql_analytics.adapters.gcp.guardrail:CloudGuardrailAdapter
    onprem: nl2sql_analytics.adapters.onprem.guardrail:OnPremGuardrailAdapter
  channel:
    local: nl2sql_analytics.adapters.local.channel:LocalChannelAdapter
    gcp: nl2sql_analytics.adapters.gcp.channel:CloudChannelAdapter
    onprem: nl2sql_analytics.adapters.onprem.channel:OnPremChannelAdapter
